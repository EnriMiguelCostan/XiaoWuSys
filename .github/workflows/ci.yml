# PB 25: automated checks on every push.
#   backend:  npm ci + npm test (Node 22), including the migration tests on a throw-away
#             PostgreSQL 16 (tests/migrations.pg.test.js; never Neon)
#   frontend: npm ci + lint + production build
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xiaowusys
          POSTGRES_PASSWORD: xiaowusys
          POSTGRES_DB: xiaowusys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xiaowusys -d xiaowusys_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: XiaoWuSys-main/Backend
    env:
      TEST_DATABASE_URL: postgresql://xiaowusys:xiaowusys@localhost:5432/xiaowusys_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: XiaoWuSys-main/Backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: XiaoWuSys-main/Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: XiaoWuSys-main/Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
