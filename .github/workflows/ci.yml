# PB 25: automated checks on every push.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xiaowusys
          POSTGRES_PASSWORD: xiaowusys
          POSTGRES_DB: xiaowusys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xiaowusys -d xiaowusys_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: XiaoWuSys-main/Backend
    env:
      TEST_DATABASE_URL: postgresql://xiaowusys:xiaowusys@localhost:5432/xiaowusys_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: XiaoWuSys-main/Backend/package-lock.json
      - run: npm ci
      - run: npm test

  shared-core:
    name: Shared Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: XiaoWuSys-main/shared/client-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: XiaoWuSys-main/Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: XiaoWuSys-main/Frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build

  web:
    name: Next.js Web lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: XiaoWuSys-main/Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: XiaoWuSys-main/Web/package-lock.json
      - run: npm install
      - run: npm run check-rules:test
      - run: npm run check-rules
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build