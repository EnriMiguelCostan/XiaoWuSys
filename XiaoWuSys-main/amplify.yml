# AWS Amplify Hosting (Next.js SSR) when XiaoWuSys-main/ itself is the repository root.
# (The parent repository uses ../amplify.yml with appRoot XiaoWuSys-main/Web.)
# In the Amplify console set AMPLIFY_MONOREPO_APP_ROOT=Web and NEXT_PUBLIC_API_URL=https://<your API>.
# Never add DATABASE_URL, PG_LISTEN_URL, JWT_SECRET or TEST_DATABASE_URL: next.config.ts refuses
# to build with them (N2).
version: 1
applications:
  - appRoot: Web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22 || nvm install 22
            - npm ci
            - npm install ../shared/client-core
            - npm run check-rules
            - npm run check-contrast
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
